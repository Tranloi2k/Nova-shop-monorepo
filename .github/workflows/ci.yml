name: CI

on:
  push:
    branches:
      - master
      - main
      - prod
  pull_request:
    branches:
      - master
      - main
      - prod

jobs:
  ci:
    name: CI Quality Gate
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      # pnpm-workspace.yaml allows only reviewed dependency build scripts.
      - name: Install allowlisted dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          # Rebuild inside every workspace so nested native dependencies (notably bcrypt) are included.
          pnpm -r rebuild @sentry/cli @swc/core bcrypt cypress sharp unrs-resolver
          pnpm --filter nestjs-app exec node -e "require('bcrypt')"

      # Auth.js requires a signing secret even when Cypress only reads the session.
      # Generate an ephemeral value for this runner instead of exposing a production secret.
      - name: Configure Auth.js for tests
        run: echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Lint
        run: pnpm lint

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Cypress E2E tests
        run: pnpm --filter nova-online-shopping-nextjs e2e
        timeout-minutes: 10

      - name: Build
        run: pnpm build

      - name: SonarQube Scan and Quality Gate
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
